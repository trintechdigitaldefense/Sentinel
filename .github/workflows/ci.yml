name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, hardening/**, remediation/**]
  pull_request:
    branches: [main, hardening/**]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt

      - name: Ruff syntax/undefined names (all maintained sources)
        run: |
          ruff check sentinel.py setup.py modules tests --select E9,F821,F823

      - name: Compile all Python modules
        run: |
          python - <<'PY'
          import py_compile, sys
          from pathlib import Path
          failed = []
          paths = [Path("sentinel.py"), Path("setup.py")]
          paths += sorted(Path("modules").rglob("*.py"))
          paths += sorted(Path("tests").rglob("*.py"))
          for p in paths:
              if not p.is_file():
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as e:
                  failed.append(f"{p}: {e}")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          print(f"OK compiled {len(paths)} files")
          PY

      - name: Future-import order guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          bad = []
          for p in Path("modules").rglob("*.py"):
              lines = p.read_text(errors="replace").splitlines()
              for i, ln in enumerate(lines):
                  if ln.strip().startswith("from __future__"):
                      for prev in lines[:i]:
                          s = prev.strip()
                          if s.startswith("import ") or (s.startswith("from ") and "future" not in s):
                              bad.append(str(p))
                      break
          if bad:
              print("imports before __future__:", bad)
              sys.exit(1)
          print("OK no imports before __future__")
          PY

      - name: Firewall smoke (dry-run, no root)
        run: python scripts/firewall_smoke.py

      - name: Pytest
        run: pytest -q tests/ --tb=line

      - name: Installer script syntax
        run: bash -n install.sh


  firewall-live-isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply, verify and roll back nftables inside an isolated container
        run: |
          docker run --rm --cap-add=NET_ADMIN \
            -e SENTINEL_ISOLATED_NFT_TEST=1 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            ubuntu:24.04 bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip nftables
              python3 -m venv /tmp/sentinel-test-venv
              /tmp/sentinel-test-venv/bin/pip install pytest
              /tmp/sentinel-test-venv/bin/pytest -q tests/test_firewall_nft_integration.py
            '
  ssh-lockout-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install isolated SSH and firewall test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nftables openssh-server openssh-client iproute2
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install pytest
          .venv/bin/pip install -r requirements.txt

      - name: Verify a real SSH session survives firewall apply, reapply and rollback
        run: |
          sudo env PATH="$PATH:$PWD/.venv/bin" SENTINEL_ISOLATED_SSH_TEST=1 .venv/bin/pytest -q tests/test_firewall_ssh_continuity.py
  agent-systemd-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot disposable Ubuntu container with systemd as PID 1
        run: |
          docker run -d --name sentinel-systemd --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            ubuntu:24.04 /sbin/init
          for attempt in $(seq 1 30); do
            if docker exec sentinel-systemd systemctl is-system-running >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec sentinel-systemd systemctl is-system-running || true

      - name: Install test dependencies in the disposable systemd container
        run: |
          docker exec sentinel-systemd bash -euxo pipefail -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip git openssl
            python3 -m venv /tmp/sentinel-test-venv
            /tmp/sentinel-test-venv/bin/pip install --upgrade pip
            /tmp/sentinel-test-venv/bin/pip install pytest
            /tmp/sentinel-test-venv/bin/pip install -r /workspace/requirements.txt
          '

      - name: Install, restart, stop, start and verify the systemd-managed agent
        run: |
          docker exec -e SENTINEL_SYSTEMD_TEST=1 sentinel-systemd \
            /tmp/sentinel-test-venv/bin/pytest -q /workspace/tests/test_agent_systemd_service.py

      - name: Remove disposable systemd container
        if: always()
        run: docker rm -f sentinel-systemd || true
