name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt

      - name: Ruff lint (critical paths)
        run: |
          ruff check sentinel.py modules/firewall.py modules/behavioral_shell.py \
            modules/persistence_hunt.py --select E9,F821

      - name: Compile core
        run: |
          python -m py_compile sentinel.py setup.py
          python -m py_compile modules/firewall.py modules/alerting.py \
            modules/persistence_hunt.py modules/behavioral_shell.py \
            modules/fim_suid.py modules/fim_realtime.py modules/doctor.py

      - name: Firewall smoke (dry-run, no root)
        run: python scripts/firewall_smoke.py

      - name: Pytest
        run: pytest -q tests/ --tb=line
