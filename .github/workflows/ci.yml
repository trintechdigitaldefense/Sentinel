name: CI

on:
  push:
    branches: [main, hardening/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  firewall-live-isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Apply, verify and roll back nftables inside an isolated container
        run: |
          docker run --rm --cap-add=NET_ADMIN \
            -e SENTINEL_ISOLATED_NFT_TEST=1 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            ubuntu:24.04 bash -euxo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip git nftables
              python3 -m venv /opt/sentinel-test-venv
              /opt/sentinel-test-venv/bin/pip install pytest
              /opt/sentinel-test-venv/bin/pytest -q tests/test_firewall_nft_integration.py
            '
  ssh-lockout-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install isolated SSH and firewall test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nftables openssh-server openssh-client iproute2
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install pytest
          .venv/bin/pip install -r requirements.txt

      - name: Verify a real SSH session survives firewall apply, reapply and rollback
        run: |
          sudo env PATH="$PATH:$PWD/.venv/bin" SENTINEL_ISOLATED_SSH_TEST=1 .venv/bin/pytest -q tests/test_firewall_ssh_continuity.py

  agent-systemd-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run disposable systemd container and wait for PID 1
        run: |
          docker run -d --name sentinel-systemd-test --privileged \
            --cgroupns=host --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -e container=docker ubuntu:24.04 bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y systemd systemd-sysv dbus && exec /sbin/init'
          for i in $(seq 1 30); do
            if docker exec sentinel-systemd-test systemctl is-system-running 2>/dev/null | grep -Eq 'running|degraded'; then
              break
            fi
            sleep 1
          done

      - name: Install Python test dependencies inside systemd container
        run: |
          docker exec sentinel-systemd-test bash -euxo pipefail -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip
            python3 -m venv /opt/sentinel-test-venv
            /opt/sentinel-test-venv/bin/pip install --upgrade pip
            /opt/sentinel-test-venv/bin/pip install pytest
          '
          docker cp . sentinel-systemd-test:/workspace

      - name: Verify systemd service install, restart, stop and start
        run: |
          docker exec sentinel-systemd-test bash -euxo pipefail -c '
            cd /workspace
            SENTINEL_SYSTEMD_TEST=1 /opt/sentinel-test-venv/bin/pytest -q tests/test_agent_systemd_service.py
          '

      - name: Remove disposable systemd container
        if: always()
        run: docker rm -f sentinel-systemd-test || true

  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest playwright
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ruff syntax/undefined names (all maintained sources)
        run: |
          ruff check sentinel.py setup.py modules tests --select E9,F821,F823

      - name: Compile all Python modules
        run: |
          python - <<'PY'
          import py_compile, sys
          from pathlib import Path
          failed = []
          paths = [Path("sentinel.py"), Path("setup.py")]
          paths += sorted(Path("modules").rglob("*.py"))
          paths += sorted(Path("tests").rglob("*.py"))
          for p in paths:
              if not p.is_file():
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as e:
                  failed.append(f"{p}: {e}")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          print(f"OK compiled {len(paths)} files")
          PY

      - name: Future-import order guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          bad = []
          for p in Path("modules").rglob("*.py"):
              lines = p.read_text(errors="replace").splitlines()
              for i, ln in enumerate(lines):
                  if ln.strip().startswith("from __future__"):
                      for prev in lines[:i]:
                          s = prev.strip()
                          if s.startswith("import ") or (s.startswith("from ") and "future" not in s):
                              bad.append(str(p))
                      break
          if bad:
              print("imports before __future__:", bad)
              sys.exit(1)
          print("OK no imports before __future__")
          PY

      - name: Firewall smoke (dry-run, no root)
        run: python scripts/firewall_smoke.py

      - name: Pytest
        run: pytest -q tests/ --tb=line

      - name: Installer script syntax
        run: bash -n install.sh
